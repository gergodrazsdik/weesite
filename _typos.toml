# typos configuration (https://github.com/crate-ci/typos)
[files]
extend-exclude = ["LICENSE", "CODE_OF_CONDUCT.md", "docs/design/brief.md", "src/Weesite.Content/Grammars/*/syntaxes/", "src/Weesite.Content/Grammars/*/LICENSE"]

[default]
# Hex code points in @font-face unicode-range values (site.css), such as U+20B8-20BA.
# Unicode general categories in regexes and patterns, such as \p{Nd} (decimal digits) in slugs.
extend-ignore-re = ["unicode-range: [^;]+;", "\\\\p\\{[A-Za-z]+\\}"]

[default.extend-words]
# Project vocabulary that is not a typo.
weesite = "weesite"
azurite = "azurite"
# File extensions listed in docs/grammars.md.
edn = "edn"
mak = "mak"
cpy = "cpy"
