---
name: Feature request
description: Suggest an improvement to Weesite.
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Check the work tracker (docs/plan/TRACKER.md) and the design brief first:
        many features are already planned. For anything non-trivial, agree on the
        approach here before opening a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? Which alternatives did you consider?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public site
        - Editor and admin
        - Search and agents (MCP, llms.txt)
        - Infrastructure and deployment
        - Tooling and CI
        - Other
