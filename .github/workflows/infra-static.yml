---
name: infra-static

# Static infrastructure checks with no credentials, so they run on every
# PR, forks included: tofu fmt and validate, TFLint, Checkov, conftest on
# the HCL and the policy tests (`just infra`). A required check: it always
# runs and skips its steps when nothing infrastructure-related changed.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# Explicit bash runs steps with -eo pipefail, so `... | tee` can't hide a failure.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infra-static:
    name: infra-static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      WEESITE_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # change detection diffs against the base
          persist-credentials: false
      - name: Look for infrastructure changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: scripts/infra-changed.sh "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
      - name: Nothing to check
        if: steps.changes.outputs.changed != 'true'
        run: echo "No changes under infra/ or policy/ (or their tooling); checks skipped." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: $/.github/actions/setup-infra-tools
        if: steps.changes.outputs.changed == 'true'
        with:
          tflint: "true"
      - name: just infra
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init fetches the ruleset (read-only)
        run: just infra
