---
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WEESITE_REQUIRE_TOOLS: "1"
      # Linter versions; bump together with the local toolchain (Dependabot only updates actions).
      JUST_VERSION: "1.59.0"
      YAMLLINT_VERSION: "1.38.0"
      TYPOS_VERSION: "1.52.0"
      ZIZMOR_VERSION: "1.31.1"
      MARKDOWNLINT_CLI2_VERSION: "0.24.0"
      ACTIONLINT_VERSION: "v1.7.12"
      EDITORCONFIG_CHECKER_VERSION: "v3.11.1"
      GITLEAKS_VERSION: "v8.30.1"
      PINACT_VERSION: "v5.0.1"
      CONFTEST_VERSION: "v0.71.1"
      TOFU_VERSION: "1.13.2"
      TFLINT_VERSION: "v0.65.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: Install linters
        run: |
          pipx install "rust-just==${JUST_VERSION}"
          pipx install "yamllint==${YAMLLINT_VERSION}"
          pipx install "typos==${TYPOS_VERSION}"
          pipx install "zizmor==${ZIZMOR_VERSION}"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          go install "github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker@${EDITORCONFIG_CHECKER_VERSION}"
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          go install "github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@${PINACT_VERSION}"
          go install "github.com/open-policy-agent/conftest@${CONFTEST_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Exact version, like the pipx and go installs above; no lockfile for one CLI (F-0006).
      - name: Install markdownlint-cli2
        run: npm install -g "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"  # zizmor: ignore[adhoc-packages]
      - name: just lint
        env:
          GITHUB_TOKEN: ${{ github.token }} # pinact resolves the pinned SHAs, tflint --init fetches the ruleset (read-only)
        run: just lint

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.31.1"

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check DCO sign-off on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
