---
# Weekly: which tool versions pinned outside Dependabot's reach (lint, infra and load-test tools,
# Checkov's lock, esbuild) have an update past the 7-day cooldown (14 for a major), and when the rest are due
# (scripts/tool-updates.py, T-0151). The table goes to the run's summary.
#
# GitHub emails about a scheduled run only when it fails (to whoever last changed its schedule).
# To hear about updates, set the repository variable TOOL_UPDATES_ISSUE to true: the issue job then
# keeps one issue, "Tool updates due", opened or commented on when something is due (which emails
# the repository's watchers) and closed when nothing is.
name: tool-updates

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions: {}

# Explicit bash runs steps with -eo pipefail, so `... | tee` can't hide a failure.
defaults:
  run:
    shell: bash

concurrency:
  group: tool-updates
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A source that can't be read fails the run, so GitHub's failure email says so.
      - name: Check the pinned tools
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/tool-updates.py --markdown --github-output | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-updates
          path: report.md
          retention-days: 1

  issue:
    name: issue
    needs: check
    if: vars.TOOL_UPDATES_ISSUE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # the one "Tool updates due" issue
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-updates
      - name: Open, comment on or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DUE: ${{ needs.check.outputs.due }}
        run: |
          title="Tool updates due"
          # Its own issue only: by title and author, as drift.yml finds its issue (T-0177).
          number=$(gh issue list --state open --author "app/github-actions" --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ "${DUE:-0}" -gt 0 ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file report.md
            else
              gh issue create --title "$title" --body-file report.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Nothing is due any more: see this week's tool-updates run."
          fi
