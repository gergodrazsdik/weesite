---
name: infra-plan

# Plans infra/app for test on same-repo PRs with the read-only plan identity
# (prod is planned only from main, by infra-apply, with the plan-main
# identity: T-0122), checks the plan JSON (conftest, Checkov) and posts change
# counts and resource addresses to the job summary and a PR comment, never
# the plan itself (the repo is public).
#
# The plan runs in the `plan` environment and waits for its reviewer: a pull
# request can sign in as the plan identity only there (T-0177). Approve after
# reading the PR, its workflow and script changes included; they run with
# that identity. PRs without infrastructure changes, forks and repositories
# without a bootstrap skip the plan without waiting.
#
# `infra-plan` is the required check: the last job, which passes when the
# plan passed or wasn't needed, and fails when either job before it failed.

on:
  pull_request:

permissions: {}

# Explicit bash runs steps with -eo pipefail, so `... | tee` can't hide a failure.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # change detection diffs against the base
          persist-credentials: false
      - name: Look for infrastructure changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: scripts/infra-changed.sh --plan "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
      - name: Decide whether to plan
        id: plan
        env:
          CHANGED: ${{ steps.changes.outputs.changed }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          # Dependabot's runs get Dependabot secrets, not Actions secrets: the bootstrap sets the
          # plan identity's there too (F-0241, T-0177). An install bootstrapped before that has none.
          HAS_CREDENTIALS: ${{ secrets.AZURE_PLAN_CLIENT_ID != '' }}
          BOOTSTRAPPED: ${{ vars.TF_STATE_STORAGE_ACCOUNT != '' }}
        run: |
          if [ "$SAME_REPO" != true ]; then
            echo "Fork PR: no credentials, so no plan. A maintainer pushes the branch to the repo to plan it." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$BOOTSTRAPPED" != true ]; then
            echo "No TF_STATE_* repository variables: this repository has no bootstrap yet (docs/deploy.md), so no plan." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$CHANGED" != true ]; then
            echo "No changes a plan reads (infra/app, the policy, the plan scripts and tools); no plan." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_CREDENTIALS" != true ]; then
            echo "No plan credentials for this run (a Dependabot PR, and the bootstrap hasn't set its Dependabot secrets yet), so no plan. infra-apply plans test after the merge." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Infrastructure changes: the plan waits for approval in the \`plan\` environment. Approve it after reading this PR's changes, workflows and scripts included." >> "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: plan (test)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Waits for the reviewer; the plan identity trusts a pull request only here (T-0177).
    environment: plan
    permissions:
      contents: read
      id-token: write # OIDC token for the plan identity
      pull-requests: write # the plan summary comment
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_use_oidc: "true"
      TF_VAR_state_resource_group: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_VAR_state_storage_account: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_VAR_state_key_vault_uri: ${{ vars.TF_STATE_KEY_VAULT_URI }}
      TF_VAR_instance: ${{ vars.WEESITE_INSTANCE }}
      APP_SETTINGS_TEST: ${{ vars.APP_SETTINGS_TEST }} # scripts/infra-plan.sh
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-infra-tools
      - name: Plan test
        run: scripts/infra-plan.sh test "$RUNNER_TEMP/plan"
      - name: Post the summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          dir="$RUNNER_TEMP/plan"
          marker="<!-- weesite:infra-plan -->"
          {
            echo "$marker"
            echo "### Infrastructure plan"
            echo
            cat "$dir/test.summary.md"
            echo
            echo "Read-only plan of \`infra/app\` for test, for this PR ([run]($RUN_URL)). Counts and addresses only: the plan itself never leaves the runner. prod is planned after the merge, by **infra-apply**, before its approval: a pull request can't read prod (T-0122)."
          } > "$dir/comment.md"
          cat "$dir/comment.md" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F "body=@$dir/comment.md" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F "body=@$dir/comment.md" > /dev/null
          fi

  # The required check. A job skipped by its `if` counts as passed, so the plan job can't be the
  # check itself: it's also skipped when the job before it fails.
  infra-plan:
    name: infra-plan
    needs: [changes, plan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the results
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          PLAN: ${{ needs.plan.result }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::Deciding whether to plan failed ($CHANGES)."
            exit 1
          fi
          if [ "$RUN" = true ] && [ "$PLAN" != success ]; then
            echo "::error::The plan didn't pass ($PLAN): rejected, failed or cancelled."
            exit 1
          fi
          if [ "$RUN" = true ]; then
            echo "Planned and checked."
          else
            echo "No plan needed."
          fi
