---
name: app

# Builds the .NET solution with the SDK from global.json (warnings are errors) and runs its tests,
# checks its formatting and code style, and runs the end-to-end tests in Chromium against the
# minified scripts and stylesheets the image ships. Builds the
# container image, writes its SBOM (syft) and scans it (grype); on main, pushes that same image
# to GHCR, tagged with the commit SHA, and deploys it to test by digest (the promote workflow
# takes the same digest to prod). Started by hand on main (a new fork has nothing to merge yet),
# it does the same as a push; on another branch it only builds and tests. A pull request that
# changes nothing the app depends on (docs, infrastructure, other workflows: scripts/app-changed.sh)
# skips the jobs; they are required checks, and a skipped job counts as passed. On main, a push
# waits for the run before it, and a newer push cancels a waiting one: `just merge-stack` pushes
# once per PR, so only the last commit of each burst of pushes is built and has its image (F-0244).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Explicit bash runs steps with -eo pipefail, so `... | tee` can't hide a failure.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      app: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # change detection diffs against the base
          persist-credentials: false
      - name: Look for changes the app depends on
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/app-changed.sh "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
          else
            echo "changed=true" | tee -a "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Each job's runner is thrown away, so Testcontainers' reaper (Ryuk) has nothing to clean up;
      # without it, the tests pull no image from Docker Hub (F-0242).
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # Nothing this job builds is published (the image job builds the image from the sources), so
      # a cached package can't reach the image.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'nuget.config', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # The code highlighter (ADR 0012): Rust, checked first, then built by the .NET build.
      - uses: $/.github/actions/setup-highlighter
      - name: Check the code highlighter (its Rust version, rustfmt, clippy, its tests)
        working-directory: native/highlight
        run: |
          ../../scripts/check-rust-version.sh
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Download the embedding model
        run: scripts/fetch-model.sh
      - name: Restore
        run: dotnet restore Weesite.slnx
      - name: Build
        run: dotnet build Weesite.slnx --no-restore --configuration Release
      # The browser tests run once, in the browser (minified) job, against the files the image
      # ships; `just test` runs them against the readable sources (F-0244).
      - name: Test
        run: dotnet test --solution Weesite.Tests.slnf --no-build --configuration Release
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test/
          retention-days: 7

  # The build already fails on most code style rules (EnforceCodeStyleInBuild); dotnet format also
  # catches the few it doesn't (IDE0003, IDE0049: .editorconfig). A job of its own: it loads and
  # analyses the whole solution again, which made build 75-85 s longer (F-0244).
  format:
    name: format
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'nuget.config', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore Weesite.slnx
      - name: Check formatting and code style
        run: dotnet format Weesite.slnx --no-restore --verify-no-changes

  # The browser tests, against the minified scripts and stylesheets the image ships (T-0104). They
  # run once, here: a second run against the readable sources found nothing this one didn't, and
  # gave every flaky test two chances to fail (F-0244).
  minified:
    name: browser (minified)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'nuget.config', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: $/.github/actions/setup-highlighter
      - name: Install esbuild (the Containerfile's version, checksum verified)
        run: |
          scripts/install-esbuild.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Minify in place, as the image build does
        run: scripts/minify.sh --in-place
      - name: Download the embedding model
        run: scripts/fetch-model.sh
      - name: Build
        run: dotnet build tests/Weesite.Web.EndToEnd --configuration Release
      # The tests run headless, which needs only Chromium's headless shell, and the runner image
      # already has its libraries: no full Chrome and no --with-deps, whose apt step only added
      # optional fonts, often from a slow mirror (F-0059, F-0179). Should the image ever lack a
      # library, the first launch fails and Playwright names it.
      - name: Install Chromium for the end-to-end tests
        run: pwsh artifacts/bin/Weesite.Web.EndToEnd/release/playwright.ps1 install --only-shell --no-progress chromium
      # Alone in its job: the other test projects start Azurite containers, and each start changes
      # the runner's network, which makes Chromium drop the pages and scripts it is loading (F-0043).
      - name: Test in the browser
        run: dotnet test --project tests/Weesite.Web.EndToEnd --no-build --configuration Release
      - name: Keep the test reports and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-minified
          path: |
            artifacts/test/
            artifacts/screens/
          retention-days: 7

  # Runs beside build (it needs only the checkout); publish waits for every job, so an image is
  # only pushed when the tests passed too.
  image:
    name: image
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          docker build --file Containerfile --tag weesite:ci \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            .
      - name: SBOM (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: weesite:ci
          format: spdx-json
          artifact-name: weesite.spdx.json
      - name: Vulnerability scan (grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: weesite:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
          # Most of the scan's time is the database download. Cached on pull requests only (a
          # PR's cache can't reach main's runs); main always scans with a fresh database.
          cache-db: ${{ github.event_name == 'pull_request' }}
      - name: Keep the scanned image for publishing
        if: github.event_name != 'pull_request'
        run: docker save weesite:ci | gzip > "$RUNNER_TEMP/weesite.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: image
          path: ${{ runner.temp }}/weesite.tar.gz
          retention-days: 1

  # Pushes the image the image job scanned, not a rebuild.
  publish:
    name: publish
    needs: [build, format, minified, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push to GHCR
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Push to GHCR
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/weesite:$SHA"
          gunzip -c "$RUNNER_TEMP/weesite.tar.gz" | docker load
          docker tag weesite:ci "$image"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          # GHCR now and then answers a push with "unknown blob" for a layer it was just sent, and the
          # next try goes through (F-0242). A push of layers already there is cheap, so try three times.
          for try in 1 2 3; do
            if docker push "$image"; then
              break
            elif [ "$try" = 3 ]; then
              exit 1
            fi
            echo "::warning::The push to GHCR failed (try $try of 3); trying again in 20 s."
            sleep 20
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-test:
    name: deploy (test)
    needs: publish
    # Repositories without a bootstrap have no environments to deploy to.
    if: vars.TF_STATE_STORAGE_ACCOUNT != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: test
    permissions:
      contents: read
      id-token: write # OIDC token for the test apply identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and smoke-test
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          WEESITE_INSTANCE: ${{ vars.WEESITE_INSTANCE }}
        run: scripts/deploy-app.sh test "$IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
