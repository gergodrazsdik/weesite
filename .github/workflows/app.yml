---
name: app

# Builds the .NET solution with the SDK from global.json (warnings are errors), checks its
# formatting and code style, and runs the tests, the end-to-end ones in Chromium. Builds the
# container image, writes its SBOM (syft) and scans it (grype); on main, pushes that same image
# to GHCR, tagged with the commit SHA. The deploy to test comes with T-0031.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# Explicit bash runs steps with -eo pipefail, so `... | tee` can't hide a failure.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Weesite.slnx
      - name: Build
        run: dotnet build Weesite.slnx --no-restore --configuration Release
      - name: Check formatting and code style
        run: dotnet format Weesite.slnx --no-restore --verify-no-changes
      - name: Install Chromium for the end-to-end tests
        run: pwsh artifacts/bin/Weesite.Web.EndToEnd/release/playwright.ps1 install --with-deps chromium
      - name: Test
        run: dotnet test --solution Weesite.slnx --no-build --configuration Release
      - name: Keep the test reports and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            artifacts/test/
            artifacts/screens/
          retention-days: 7

  image:
    name: image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          docker build --file Containerfile --tag weesite:ci \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            .
      - name: SBOM (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: weesite:ci
          format: spdx-json
          artifact-name: weesite.spdx.json
      - name: Vulnerability scan (grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: weesite:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
      - name: Keep the scanned image for publishing
        if: github.event_name == 'push'
        run: docker save weesite:ci | gzip > "$RUNNER_TEMP/weesite.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: image
          path: ${{ runner.temp }}/weesite.tar.gz
          retention-days: 1

  # Pushes the image the image job scanned, not a rebuild.
  publish:
    name: publish
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/weesite:$SHA"
          gunzip -c "$RUNNER_TEMP/weesite.tar.gz" | docker load
          docker tag weesite:ci "$image"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "Pushed \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
