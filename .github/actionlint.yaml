---
# actionlint configuration (https://github.com/rhysd/actionlint/blob/main/docs/config.md)
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint 1.7.12 doesn't know GitHub's self-repository syntax
      # (`uses: $/<path>`, July 2026), which zizmor's self-repository audit
      # asks for. Drop this once actionlint supports it.
      - 'specifying action "\$/[^"]+" in invalid format because ref is missing'
