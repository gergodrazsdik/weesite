---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14  # let new releases age two weeks before proposing them
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
  # OpenTofu providers: the version constraints in versions.tf and the
  # .terraform.lock.hcl of each root. The lock files record
  # registry.opentofu.org, which the `terraform` ecosystem doesn't read.
  - package-ecosystem: opentofu
    directories:
      - /infra/bootstrap
      - /infra/app
    schedule:
      interval: weekly
    cooldown:
      default-days: 14  # let new releases age two weeks before proposing them
    commit-message:
      prefix: build
      include: scope
    groups:
      opentofu-providers:
        patterns: ["*"]
  # NuGet: versions live in Directory.Packages.props. The same 14 days as the
  # minPublishAgeHours cooldown in nuget.config.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      aspire:
        patterns: ["Aspire.*", "Microsoft.Extensions.ServiceDiscovery*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      tests:
        patterns: ["TUnit*", "Microsoft.Playwright", "Deque.AxeCore.*", "Microsoft.AspNetCore.Mvc.Testing"]
      other:
        patterns: ["*"]

  # Base images in the Containerfile, pinned by digest: new digests carry OS fixes.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      dotnet-images:
        patterns: ["dotnet/*"]
