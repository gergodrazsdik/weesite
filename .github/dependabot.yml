---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14  # let new releases age two weeks before proposing them
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
# Added with the code (see docs/plan/TRACKER.md): `nuget` and `docker` with the
# .NET solution and Containerfile, `terraform` with infra/ (check that it
# picks up the OpenTofu lock file).
