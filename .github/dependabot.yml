---
# New releases wait 7 days before Dependabot proposes them, major versions
# too: the same rule as nuget.config, scripts/tool-updates.py and the
# maintainer's machine.
version: 2
updates:
  # The workflows (/ reads .github/workflows) and the composite actions in
  # .github/actions, which / alone doesn't read.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
  # OpenTofu providers: the version constraints in versions.tf and the
  # .terraform.lock.hcl of each root. The lock files record
  # registry.opentofu.org, which the `terraform` ecosystem doesn't read.
  - package-ecosystem: opentofu
    directories:
      - /infra/bootstrap
      - /infra/app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      opentofu-providers:
        patterns: ["*"]
  # NuGet: versions live in Directory.Packages.props. nuget.config's
  # minPublishAgeHours keeps hand-made updates 7 days back too.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      aspire:
        patterns: ["Aspire.*", "Microsoft.Extensions.ServiceDiscovery*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      tests:
        patterns: ["TUnit*", "Microsoft.Playwright", "Deque.AxeCore.*", "Microsoft.AspNetCore.Mvc.Testing"]
      other:
        patterns: ["*"]

  # The code highlighter's crates (native/highlight/Cargo.lock, ADR 0012).
  - package-ecosystem: cargo
    directory: /native/highlight
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      highlighter:
        patterns: ["*"]

  # Base images in the Containerfile, pinned by digest: new digests carry OS fixes.
  # The rust image builds the code highlighter: its tag is the Rust the image
  # uses, at least Cargo.toml's rust-version.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      dotnet-images:
        patterns: ["dotnet/*"]
