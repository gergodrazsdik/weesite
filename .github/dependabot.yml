---
# New releases wait 7 days before Dependabot proposes them, majors 14 where
# the ecosystem can tell them apart (NuGet); GitHub Actions, OpenTofu and
# Docker have only the one setting. The same rule as nuget.config and
# scripts/tool-updates.py.
version: 2
updates:
  # The workflows (/ reads .github/workflows) and the composite actions in
  # .github/actions, which / alone doesn't read.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
  # OpenTofu providers: the version constraints in versions.tf and the
  # .terraform.lock.hcl of each root. The lock files record
  # registry.opentofu.org, which the `terraform` ecosystem doesn't read.
  - package-ecosystem: opentofu
    directories:
      - /infra/bootstrap
      - /infra/app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      opentofu-providers:
        patterns: ["*"]
  # NuGet: versions live in Directory.Packages.props. nuget.config's
  # minPublishAgeHours keeps hand-made updates 7 days back too.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      aspire:
        patterns: ["Aspire.*", "Microsoft.Extensions.ServiceDiscovery*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      tests:
        patterns: ["TUnit*", "Microsoft.Playwright", "Deque.AxeCore.*", "Microsoft.AspNetCore.Mvc.Testing"]
      other:
        patterns: ["*"]

  # The code highlighter's crates (native/highlight/Cargo.lock, ADR 0012). The
  # Rust toolchain itself is in rust-toolchain.toml: scripts/tool-updates.py.
  - package-ecosystem: cargo
    directory: /native/highlight
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      highlighter:
        patterns: ["*"]

  # Base images in the Containerfile, pinned by digest: new digests carry OS fixes.
  # A new rust image version needs rust-toolchain.toml moved with it: the app
  # workflow checks that the two agree.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      dotnet-images:
        patterns: ["dotnet/*"]
